# Replace hostnames before installing. Certbot adds HTTPS and redirects
# to the installed configuration; see docs/guides/nginx.md.
server {
    listen 80;
    server_name api.example.com;

    location / {
        include /etc/nginx/hono-deploy/hono-server/upstream.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
